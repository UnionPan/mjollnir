[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mjollnir"
version = "0.4.0"
description = "Counterfactual market simulation and backtesting for RL research, with market-model calibration pipelines"
readme = "README.md"
requires-python = ">=3.11"  # floor set by jax 0.9 / flax (both >=3.11)
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Yunian Pan", email = "yp1170@nyu.edu"}
]
keywords = [
    "options", "derivatives", "quantitative-finance", "stochastic-processes",
    "market-simulation", "calibration", "jax", "reinforcement-learning", "deep-hedging",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# The core: simulators, pricers, hedging backtests, scenarios and calibrators.
# flax/optax are core (the NPE posterior networks). Market-data fetchers, the
# calibration pipeline and the gym environments are extras, imported only by
# the modules that need them (see mjollnir._optional). torch is intentionally
# not a dependency.
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "jax>=0.9.0,<0.13",  # suite verified on 0.9 and 0.12
    "jaxlib>=0.9.0,<0.13",
    "flax>=0.8.0",
    "optax>=0.2.0",
]

[project.optional-dependencies]
# yfinance and the exchange fetchers (mjollnir.calibration.marketdata)
data = [
    "yfinance>=0.2.28",
    "requests>=2.31.0",
]
# the price and results stores and the universe calibration runner (parquet, parallel fits)
pipeline = [
    "mjollnir[data]",
    "pyarrow>=14.0.0",
    "joblib>=1.3.0",
]
# the gymnasium environments, their zarr cache and the matplotlib renderer (mjollnir.simulations)
envs = [
    "gymnasium>=0.29.0",
    "zarr>=2.16.0",
    "matplotlib>=3.7.0",
]
all = ["mjollnir[data,pipeline,envs]"]
dev = [
    "mjollnir[all]",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.100",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.4.0",
]
# JAX device backends (install exactly one to match your hardware).
cuda = ["jax[cuda12]>=0.9.0,<0.13"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.24"]
metal = ["jax-metal>=0.1.0"]

[project.urls]
Homepage = "https://github.com/unionpan/mjollnir"
Documentation = "https://yunianpan.com/mjollnir/"
Repository = "https://github.com/unionpan/mjollnir"
Changelog = "https://github.com/unionpan/mjollnir/blob/main/CHANGELOG.md"

[project.scripts]
mjollnir-params = "mjollnir.cli:main"
mjollnir-build-universes = "mjollnir.calibration.cli.build_universes:main"
mjollnir-calibrate = "mjollnir.calibration.cli.calibrate:main"
mjollnir-train-npe = "mjollnir.calibration.cli.train_npe:main"
mjollnir-train-posterior = "mjollnir.inference.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "examples", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "RUF", "BLE"]  # BLE: no blind except
ignore = [
    "E501",   # long lines: scientific formulas read better unwrapped
    "E741",   # ambiguous single-letter names: standard math notation (l, I) in kernels
    "B008",   # function call in default: used deliberately for frozen param defaults
    "RUF001", "RUF002", "RUF003",  # Greek letters / math glyphs in docstrings are deliberate
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]        # re-export surfaces
"examples/*.py" = ["E402"]         # narrative imports at the step that uses them
"tests/*.py" = ["E731"]            # one-line lambda strategies read better in tests
"src/mjollnir/pricer/__init__.py" = ["F403", "F405"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running statistical recovery tests",
    "network: needs live market data over the internet (deselected by default; run with -m network)",
]
addopts = "-m 'not network'"
filterwarnings = [
    "error::DeprecationWarning:mjollnir.*",  # our own deprecations are bugs
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mjollnir = ["py.typed", "**/*.json", "**/*.yaml", "**/*.yml"]
